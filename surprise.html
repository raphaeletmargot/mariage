<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Surprise · Raphaël & Margot</title>
  <link rel="icon" type="image/svg+xml" href="orangerie-logo.svg" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    #play { position: fixed; inset: 0; display: none; border: 0; background: #0008; color: white; font: 700 28px sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <video id="video" src="surprise.mp4" autoplay playsinline controls></video>
  <button id="play" type="button">▶ Lancer la surprise</button>
  <script>
    const video = document.getElementById('video');
    const play = document.getElementById('play');
    // Browsers may block autoplay with sound; fall back to a click.
    video.play().catch(() => { play.style.display = 'block'; });
    play.addEventListener('click', () => { play.style.display = 'none'; video.play(); });
  </script>
</body>
</html>
