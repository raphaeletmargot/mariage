  <title id="map-title">Plan dessiné du domaine de Courtalain</title>
  <desc id="map-desc">Vue schématique de dessus, dessinée à l'encre. Le château et l'entrée piétons sont au sud-ouest; chambres et Salle des Rois au sud; pelouses, cour et Orangerie au centre; gîtes, parkings et entrée voitures à l'est.</desc>
