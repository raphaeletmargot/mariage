<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bienvenue sur le site du mariage de Raphaël et Margot, du 15 au 17 mai 2027.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6b7a5f">
  <title>Bienvenue · Raphaël & Margot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barrio&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="accueil.css">
  <script src="invites.js" defer></script>
  <script src="accueil.js" defer></script>
</head>
<body>
  <main class="welcome">
    <div class="welcome-content">
      <div class="invitation">
        <p class="eyebrow">Mariage de</p>
        <h1>Raphaël <span>&</span><br>Margot</h1>
        <p class="login-place">Château de Courtalain</p>
        <p class="login-date">15.05.2027 - 17.05.2027</p>

        <form id="guest-form">
          <div class="fields">
            <label for="first-name">Prénom
              <input id="first-name" name="firstName" autocomplete="given-name" placeholder="Votre prénom" required>
            </label>
            <label for="last-name">Nom
              <input id="last-name" name="lastName" autocomplete="family-name" placeholder="Votre nom" required>
            </label>
          </div>
          <button type="submit">Découvrir mon invitation</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </div>

    <aside class="photo" aria-label="Le château de Courtalain">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Chateau-de-courtalain_vu-du-parc.jpg?width=1400" alt="Le château de Courtalain vu depuis son parc">
    </aside>
  </main>
  <noscript><p class="no-script">Pour accéder à votre invitation, veuillez activer JavaScript ou appelez <a href="tel:+33646881521">Raphaël Lasry</a> ou <a href="tel:+33669206171">Margot Cosson</a>.</p></noscript>
</body>
</html>
